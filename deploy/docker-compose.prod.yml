# 生产环境 Compose（公网服务器用，与本地 docker-compose.yml 完全独立）
# 架构: nginx(80/443) → frontend(3000) / backend(8000) → db(5432)
# 前端后端不暴露公网端口，全部经 nginx 反代（同源，无需配 CORS）
#
# 用法:
#   首次:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#          docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T backend alembic upgrade head
#   更新:  ./deploy.sh

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: captureos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: captureos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captureos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://captureos:${POSTGRES_PASSWORD}@db:5432/captureos
      APP_NAME: CaptureOS
      DEBUG: "false"
      # 同源部署，CORS 基本用不上，仍放行域名与本地备用
      CORS_ORIGINS: '["https://example.com","https://www.example.com","http://localhost:3000","http://localhost:8001"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/backups
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  frontend:
    image: ${FRONTEND_IMAGE}
    expose:
      - "3000"
    environment:
      # 同源部署，浏览器用相对路径调后端
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  nginx:
    image: nginx:1.25-alpine
    container_name: captureos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # HTTPS 证书自动签发与续签（Let's Encrypt）
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # 首次签证书用，后续靠 cron 续签
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # 启动时自动备份（sidecar，执行完自动退出，同一天只备份一次）
  backup:
    image: docker:24-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backups_data:/backups
      - uploads_data:/uploads:ro
      - ../scripts/backup.sh:/scripts/backup.sh:ro
    environment:
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      DB_CONTAINER: captureos-db-1
      RETENTION_DAYS: "14"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: sh /scripts/backup.sh

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  certbot_data:
  certbot_www:
