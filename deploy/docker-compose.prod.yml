# 生产环境 Compose（公网服务器用，与本地 docker-compose.yml 完全独立）
# 用法: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# 更新: docker compose --env-file .env.prod -f docker-compose.prod.yml pull && up -d
#
# 与本地的差异（通过 .env.prod 注入，不写死）：
#   - CORS_ORIGINS       → 服务器公网地址
#   - NEXT_PUBLIC_API_URL → 服务器公网地址
#   - POSTGRES_PASSWORD  → 强密码
#   - 数据库端口不对外暴露
#   - 不使用 --reload
#   - 含 backup sidecar

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: captureos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: captureos
    # 生产环境不暴露数据库端口
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captureos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://captureos:${POSTGRES_PASSWORD}@db:5432/captureos
      APP_NAME: CaptureOS
      DEBUG: "false"
      CORS_ORIGINS: '${CORS_ORIGINS}'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/backups
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # 启动时自动备份（sidecar，执行完自动退出，同一天只备份一次）
  backup:
    image: docker:24-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backups_data:/backups
      - uploads_data:/uploads:ro
      - ../scripts/backup.sh:/scripts/backup.sh:ro
    environment:
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      DB_CONTAINER: captureos-db-1
      RETENTION_DAYS: "14"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: sh /scripts/backup.sh

volumes:
  postgres_data:
  uploads_data:
  backups_data:
