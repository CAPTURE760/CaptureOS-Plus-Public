# 生产环境 Compose（公网服务器用，与本地 docker-compose.yml 完全独立）
# 架构: Cloudflare(HTTPS) → 宿主机 nginx(80) → 127.0.0.1:3003(frontend) / 127.0.0.1:8000(backend) → db(5432)
# 前端后端仅绑定回环地址 127.0.0.1，不暴露公网，统一经宿主机 nginx 反代（同源，无需配 CORS）
# HTTPS 由 Cloudflare 提供（Flexible 模式），源站 nginx 仅监听 80 端口
# 注意: frontend 用 3003 端口而非 3000，避免与服务器上 已有监控服务(127.0.0.1:3000) 冲突
#
# 用法:
#   首次:  按 README 步骤放置宿主机 nginx 配置后执行 ./init.sh
#   更新:  ./deploy.sh

services:
  db:
    image: postgres:16-alpine
    container_name: captureos-db
    environment:
      POSTGRES_USER: captureos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: captureos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captureos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    # 仅绑定回环地址，宿主机 nginx 反代到 127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://captureos:${POSTGRES_PASSWORD}@db:5432/captureos
      DATABASE_URL_SYNC: postgresql+psycopg2://captureos:${POSTGRES_PASSWORD}@db:5432/captureos
      APP_NAME: CaptureOS
      DEBUG: "false"
      # 同源部署，CORS 基本用不上，仍放行域名与本地备用
      CORS_ORIGINS: '["https://example.com","https://www.example.com","http://localhost:3000","http://localhost:8001"]'
      # ── 多用户认证 ──
      SINGLE_USER_MODE: "false"
      SECRET_KEY: ${SECRET_KEY}
      JWT_EXPIRE_DAYS: "7"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/backups
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  frontend:
    image: ${FRONTEND_IMAGE}
    # 仅绑定回环地址，宿主机 nginx 反代到 127.0.0.1:3003
    # 用 3003 而非 3000，避免与服务器 已有监控服务(127.0.0.1:3000) 冲突
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      # 同源部署，浏览器用相对路径调后端
      NEXT_PUBLIC_API_URL: /api
      # ── 多用户认证 ──
      NEXT_PUBLIC_SINGLE_USER_MODE: "false"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # HTTPS 证书自动签发与续签（Let's Encrypt）
  # 证书目录和 acme-challenge 目录绑定挂载到宿主机，供宿主机 nginx 读取/提供验证
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    # 续签用 webroot 模式（宿主机 nginx 提供 acme-challenge），无需占用 80 端口
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # 启动时自动备份（sidecar，执行完自动退出，同一天只备份一次）
  backup:
    image: docker:24-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backups_data:/backups
      - uploads_data:/uploads:ro
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    environment:
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      DB_CONTAINER: captureos-db
      RETENTION_DAYS: "14"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: sh /scripts/backup.sh

volumes:
  postgres_data:
  uploads_data:
  backups_data:
