# CaptureOS 宿主机 nginx 完整配置（HTTPS 反代）
# 用法: 拷贝到 /etc/nginx/conf.d/example.com.conf 或 /etc/nginx/sites-enabled/example.com
#       然后 nginx -t && systemctl reload nginx
# 前置: 已通过 example.com.acme.conf 签发好证书（见 deploy/README.md）

# HTTP → HTTPS 重定向（保留 ACME 验证路径供续签）
server {
    listen 80;
    server_name example.com www.example.com;

    # Let's Encrypt webroot 验证（与 certbot 容器共享目录）
    location /.well-known/acme-challenge/ {
        root /opt/CaptureOS/deploy/certbot-www;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    # Let's Encrypt 证书路径（certbot 容器绑定挂载到宿主机 ./certs）
    ssl_certificate /opt/CaptureOS/deploy/certs/live/example.com/fullchain.pem;
    ssl_certificate_key /opt/CaptureOS/deploy/certs/live/example.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端 API（FastAPI）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查（直接透传，不缓存）
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # 前端页面（Next.js）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js WebSocket（HMR 用，生产一般不需要但保留）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 静态资源长缓存（文件名带哈希）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # 上传附件（immutable 长缓存）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "public, immutable";
    }
}
