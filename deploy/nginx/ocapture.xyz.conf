# CaptureOS 宿主机 nginx 配置（Cloudflare Flexible 模式）
# 架构: 用户 → Cloudflare(HTTPS) → 宿主机 nginx(HTTP:80) → 应用
# 用法: 拷贝到 /etc/nginx/conf.d/example.com.conf
#       然后 nginx -t && systemctl reload nginx
# 前置: Cloudflare 已接入域名，SSL/TLS 模式设为 Flexible

server {
    listen 80;
    server_name example.com www.example.com;

    # Let's Encrypt webroot 验证（保留，供 certbot 续签备用）
    location /.well-known/acme-challenge/ {
        root /opt/CaptureOS/deploy/certbot-www;
    }

    # 前端 API（FastAPI）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # 上传附件（immutable 长缓存）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "public, immutable";
    }

    # 前端页面（Next.js）
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js WebSocket（HMR 用，生产一般不需要但保留）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 静态资源长缓存（文件名带哈希）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }
}
