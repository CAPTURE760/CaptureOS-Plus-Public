# 【备用】直接 HTTPS 方案（非 Cloudflare）首次签发证书用的临时配置
# 当前生产环境使用 Cloudflare Flexible 模式，无需此文件。
# 仅在不使用 Cloudflare、改用宿主机 nginx 直接提供 HTTPS 时才需要。

server {
    listen 80;
    server_name example.com www.example.com;

    # Let's Encrypt webroot 验证（与 certbot 容器共享目录）
    location /.well-known/acme-challenge/ {
        root /opt/CaptureOS/deploy/certbot-www;
    }

    # 其余请求返回 200 占位，避免签证书期间站点报错
    location / {
        return 200 "CaptureOS is initializing...\n";
        add_header Content-Type text/plain;
    }
}
