# CaptureOS 首次签发证书用的临时 nginx 配置（仅 HTTP + ACME 验证）
# 用法: 首次部署时先拷贝此文件到 /etc/nginx/conf.d/example.com.conf，
#       nginx -t && systemctl reload nginx，然后执行 init.sh 签证书；
#       签好后用 example.com.conf（完整 HTTPS 配置）替换本文件。

server {
    listen 80;
    server_name example.com www.example.com;

    # Let's Encrypt webroot 验证（与 certbot 容器共享目录）
    location /.well-known/acme-challenge/ {
        root /opt/CaptureOS/deploy/certbot-www;
    }

    # 其余请求返回 200 占位，避免签证书期间站点报错
    location / {
        return 200 "CaptureOS is initializing...\n";
        add_header Content-Type text/plain;
    }
}
