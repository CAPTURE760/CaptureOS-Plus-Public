services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: captureos
      POSTGRES_PASSWORD: captureos
      POSTGRES_DB: captureos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captureos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://captureos:captureos@db:5432/captureos
      APP_NAME: CaptureOS
      # 开发环境保持调试模式（方便调试）
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8001"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backups:/backups
    # 开发环境使用 --reload（方便开发）
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        # 构建期注入，否则客户端会回退到 /api，经 Next rewrite 代理时触发 FastAPI 尾斜杠重定向循环
        NEXT_PUBLIC_API_URL: http://localhost:8001/api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # 启动时自动备份（sidecar，执行完自动退出，同一天只备份一次）
  backup:
    image: docker:24-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/backups
      - ./backend/uploads:/uploads:ro
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    environment:
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      DB_CONTAINER: captureos-db-1
      RETENTION_DAYS: "14"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: sh /scripts/backup.sh

volumes:
  postgres_data:
